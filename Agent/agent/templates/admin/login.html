{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block extra_css %}
<style>
    .login-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.9)), url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40');
        background-size: cover;
        background-position: center;
        padding: 50px 0;
    }

    .login-container {
        max-width: 450px;
        width: 100%;
        padding: 40px;
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-lg);
        background-color: #fff;
        position: relative;
        overflow: hidden;
    }

    .login-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: var(--secondary);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h2 {
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 10px;
    }

    .login-icon {
        font-size: 3rem;
        color: var(--secondary);
        margin-bottom: 20px;
    }

    .error-message {
        color: var(--danger);
        margin-bottom: 20px;
        padding: 10px 15px;
        background-color: rgba(231, 76, 60, 0.1);
        border-radius: var(--border-radius);
        font-weight: 500;
    }

    .form-control {
        padding: 12px 15px;
        border-radius: var(--border-radius);
        border: 1px solid #ddd;
        transition: var(--transition);
    }

    .form-control:focus {
        border-color: var(--secondary);
        box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
    }

    .btn-login {
        padding: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        background-color: var(--secondary);
        border-color: var(--secondary);
        transition: var(--transition);
    }

    .btn-login:hover {
        background-color: var(--secondary-light);
        border-color: var(--secondary-light);
        transform: translateY(-2px);
    }

    .back-to-site {
        text-align: center;
        margin-top: 20px;
    }
</style>
{% endblock %}

{% block content %}
<section class="login-section">
    <div class="container">
        <div class="login-container" data-aos="fade-up">
            <div class="login-header">
                <i class="fas fa-shield-alt login-icon"></i>
                <h2>Admin Login</h2>
                <p class="text-muted">Enter your credentials to access the admin panel</p>
            </div>

            {% if error_message %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error_message }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'custom_admin_login' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login w-100">Login to Dashboard</button>
            </form>

            <div class="back-to-site">
                <a href="{% url 'home' %}" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-2"></i>Back to Website
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
