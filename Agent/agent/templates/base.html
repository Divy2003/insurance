<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Insurance Agent and Financial Planner">
    <title>{% block title %}Insurance Professional{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- AOS Animation Library -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "includes/navbar.html" %}

    {% block content %}{% endblock %}

    {% include "includes/footer.html" %}

    <!-- Scroll to Top Button -->
    <a href="#" class="scroll-top" id="scrollTop">
        <i class="fas fa-arrow-up"></i>
    </a>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true,
            mirror: false
        });
    </script>

    <!-- Custom JavaScript for navbar -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get all navbar links
            var navLinks = document.querySelectorAll('.navbar-nav .nav-link');
            var navbarToggler = document.querySelector('.navbar-toggler');
            var navbarCollapse = document.querySelector('.navbar-collapse');

            // Add click event to each link
            navLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    // If navbar is expanded (in mobile view) and not already collapsing
                    if (navbarCollapse.classList.contains('show')) {
                        // Use Bootstrap's collapse method to hide the menu
                        var bsCollapse = new bootstrap.Collapse(navbarCollapse);
                        bsCollapse.hide();
                    }
                });
            });

            // Add active class to nav links based on current section
            window.addEventListener('scroll', function() {
                let scrollPosition = window.scrollY + 100;
                const navbar = document.querySelector('.navbar');

                // Add scrolled class to navbar when scrolled
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }

                document.querySelectorAll('section[id]').forEach(section => {
                    const sectionTop = section.offsetTop;
                    const sectionHeight = section.offsetHeight;
                    const sectionId = section.getAttribute('id');

                    if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
                        document.querySelector('.navbar-nav a[href*=' + sectionId + ']').classList.add('active');
                    } else {
                        document.querySelector('.navbar-nav a[href*=' + sectionId + ']').classList.remove('active');
                    }
                });

                // Show/hide scroll to top button
                const scrollTopBtn = document.getElementById('scrollTop');
                if (window.scrollY > 300) {
                    scrollTopBtn.classList.add('active');
                } else {
                    scrollTopBtn.classList.remove('active');
                }
            });

            // Scroll to top functionality
            document.getElementById('scrollTop').addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
